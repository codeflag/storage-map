name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `storage-map --version`
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: System details
      description: For example Windows 11 or Ubuntu 24.04, and the file system of the drive
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If possible, reproduce it with `--demo` or `--sandbox`, so that no private paths appear here.
  - type: markdown
    attributes:
      value: Please do not post screenshots or logs that show private file names. Report security problems as described in SECURITY.md.
